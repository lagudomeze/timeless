[package]
name = "timeless-app"
version = "0.1.0"
edition = "2024"

[dependencies]
timeless-domain = { path = "../timeless-domain" }
# 版本检索来源：crates.io 索引（经清华镜像）—— 最新稳定版 bevy 0.19.1
bevy = "0.19"
# 中文分词修复（配合 vendor/parley 补丁）：
# 补丁版 parley 调用 WordSegmenter::new_auto，需要 icu_segmenter 的
# compiled_data + auto 两个 feature；compiled_data 由 parley 声明，
# auto 由这里统一开启（版本须与锁文件解析的 2.3.0 一致）。
icu_segmenter = { version = "2.3.0", features = ["auto"] }
# 调试面板：0.37 对应 bevy 0.19（0.36 对应 0.18，勿降级）
bevy-inspector-egui = "0.37"
# 调试面板的 egui 运行时（包名为下划线形式 bevy_egui；直接依赖方可直接 use）
bevy_egui = "0.40"
