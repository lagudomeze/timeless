[package]
name = "app"
version = "0.1.0"
edition = "2024"

[features]
# 开发期热重载：改 `assets/` 里的文件存盘后自动重新加载，不用重启。
# 生产构建不带它（它会把文件监视器拉进依赖树）。
#   cargo run --features hot-reload
hot-reload = ["bevy/file_watcher"]

[dependencies]
rand = "0.10.2"
bevy_brp_extras = "0.22"
# 动作数值外置（`config/actions.ron`）：serde 做结构，ron 做格式。
# 两个都在 bevy 的依赖树里，但要用它们的**派生宏**就得直接依赖。
serde = { version = "1", features = ["derive"] }
ron = "0.12"

# 字体验收用（`tests/assets.rs`）：逐字查 `cmap`，确认中文字形不缺失。
# 它本来就在 bevy_text 的依赖树里，这里只是把它提成直接依赖。
[dev-dependencies]
skrifa = "0.44"

[dependencies.bevy]
version = "0.19"
features = ["default", "bevy_remote"]
